# CI for develop and staging only; automatic deployments target staging.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|staging)$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "staging"'
    - when: never

stages:
  - quality
  - test
  - deploy

deployment-check:
  stage: quality
  image: docker:29-cli
  before_script:
    - apk add --no-cache bash git jq make shellcheck
  script:
    - deploy/tests/run.sh
    - shellcheck deploy-dev-staging.sh deploy/tests/*.sh
  artifacts:
    expire_in: 1 day
    paths:
      - deploy-dev-staging.sh

php-check:
  stage: test
  image: composer:2
  variables:
    APP_ENV: testing
    APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    COMPOSER_ALLOW_SUPERUSER: "1"
    COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.cache/composer
  before_script:
    - |
      printf '\n==> PHP extensions: gd, pcntl\n'
      if ! apk add --no-cache libpng-dev libjpeg-turbo-dev freetype-dev libwebp-dev > /tmp/apk.log 2>&1; then
        cat /tmp/apk.log
        exit 1
      fi
      if ! docker-php-ext-configure gd --with-freetype --with-jpeg --with-webp > /tmp/php-ext.log 2>&1 \
        || ! docker-php-ext-install -j"$(nproc)" gd pcntl >> /tmp/php-ext.log 2>&1; then
        cat /tmp/php-ext.log
        exit 1
      fi
      for extension in gd pcntl; do
        php -m | grep -Fx "$extension" > /dev/null
        printf '%s: OK\n' "$extension"
      done
    - cd proxy
    - |
      printf '\n==> Laravel test environment\n'
      install -m 600 /dev/null .env
      printf '.env: initialized empty with mode 0600\n'
    - composer install --no-interaction --prefer-dist --no-progress
    - php artisan wayfinder:generate --with-form --no-interaction
  script:
    - composer test
  artifacts:
    expire_in: 1 hour
    paths:
      - proxy/resources/js/actions
      - proxy/resources/js/routes
      - proxy/resources/js/wayfinder

frontend-check:
  stage: test
  image: oven/bun:1.4.2-alpine
  needs:
    - job: php-check
      artifacts: true
  before_script:
    - apk add --no-cache nodejs-current
    - cd proxy
    - node --version
    - bun --version
    - bun ci
  script:
    - bun run lint:check
    - bun run format:check
    - bun run types:check
    - bun test

deploy:staging:
  stage: deploy
  image: alpine:3.24
  variables:
    GIT_STRATEGY: none
  needs:
    - job: deployment-check
      artifacts: true
    - job: php-check
      artifacts: false
    - job: frontend-check
      artifacts: false
  resource_group: staging
  interruptible: false
  environment:
    name: staging
    url: https://proxygeoapi.netseven.work
    deployment_tier: staging
  before_script:
    - apk add --no-cache openssh-client
    - install -m 700 -d ~/.ssh
    - cp "$DEPLOY_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts "$DEPLOY_SSH_KEY"
    - eval "$(ssh-agent -s)"
    - ssh-add "$DEPLOY_SSH_KEY"
  script:
    - |
      case "$DEPLOY_PORT" in
        ''|*[!0-9]*) printf '%s\n' 'DEPLOY_PORT must contain only decimal digits' >&2; exit 1 ;;
      esac
      if [ "${#DEPLOY_PORT}" -gt 5 ] || [ "$DEPLOY_PORT" -lt 1 ] || [ "$DEPLOY_PORT" -gt 65535 ]; then
        printf '%s\n' 'DEPLOY_PORT must be between 1 and 65535' >&2
        exit 1
      fi
      case "$DEPLOY_PATH" in
        /*) ;;
        *) printf '%s\n' 'DEPLOY_PATH must be absolute' >&2; exit 1 ;;
      esac
      case "$DEPLOY_PATH" in
        *[!A-Za-z0-9_./-]*) printf '%s\n' 'DEPLOY_PATH contains unsupported characters' >&2; exit 1 ;;
      esac
      case "$CI_COMMIT_SHA" in
        *[!0-9a-f]*|'') printf '%s\n' 'CI_COMMIT_SHA is not hexadecimal' >&2; exit 1 ;;
      esac
      if [ "${#CI_COMMIT_SHA}" -ne 40 ]; then
        printf '%s\n' 'CI_COMMIT_SHA must contain 40 hexadecimal characters' >&2
        exit 1
      fi
      ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && bash -s -- staging '$CI_COMMIT_SHA'" < deploy-dev-staging.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "staging"'
